openapi: 3.0.3
info:
  title: Discipline Sub-Report Excel Export API (FILE 5 Civil / FILE 6 Electrical)
  version: 1.0.0
paths:
  /api/v1/projects/{project_pk}/units/{unit}/daily-reports/{id}/excel/:
    get:
      summary: Export discipline sub-report as trade-specific Excel spreadsheet
      description: |
        Generates Shiraz FILE 5 (Civil) when unit is 'buildings' (with parcel and execution percentage 0.0%),
        or Shiraz FILE 6 (Electrical) when unit is 'electrical' (omitting parcel and percentage).
      operationId: exportSubReportExcel
      parameters:
        - name: project_pk
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: unit
          in: path
          required: true
          schema:
            type: string
            enum: [buildings, electrical, mechanical, machinery, warehouse, security]
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trade-specific Excel spreadsheet
          headers:
            Content-Disposition:
              schema:
                type: string
                example: attachment; filename="civil-subreport-1403-11-14.xlsx"
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          description: Unauthenticated
        '403':
          description: Permission denied (requires view_reports and project membership)
        '404':
          description: Sub-report or project not found
