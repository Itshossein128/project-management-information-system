# Isolated A.7-P5 acceptance stack. Do not point this at shared Postgres, Redis, or queues.
# RabbitMQ is intentionally absent. Start only with the private env file.

name: a7p5-import

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: a7p5
      POSTGRES_PASSWORD: a7p5
      POSTGRES_DB: a7p5_import
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a7p5 -d a7p5_import"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: a7p5-api:acceptance
    init: true
    build:
      context: ../../apps/api
      network: ${A7P5_BUILD_NETWORK:-default}
    env_file: .env.acceptance
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --timeout 90 --workers 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 40
    ports:
      - "127.0.0.1:18000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    cgroup: host
    volumes:
      - ${A7P5_CGROUP_HOST_ROOT:?Run prepare-host.sh first}:/var/a7p5-cgroup:rw
      - ${A7P5_SCRATCH_HOST_ROOT:?Run prepare-host.sh first}:/var/a7p5-scratch:rw
      - ../../real-data/plan.mpp:/fixtures/plan.mpp:ro

  import-worker:
    image: a7p5-api:acceptance
    init: true
    env_file: .env.acceptance
    environment:
      SKIP_MIGRATIONS: "true"
    command: celery -A config worker -l info -Q a7p5-import -c 1 --prefetch-multiplier=1
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    cgroup: host
    volumes:
      - ${A7P5_CGROUP_HOST_ROOT:?Run prepare-host.sh first}:/var/a7p5-cgroup:rw
      - ${A7P5_SCRATCH_HOST_ROOT:?Run prepare-host.sh first}:/var/a7p5-scratch:rw
      - ../../real-data/plan.mpp:/fixtures/plan.mpp:ro

  maintenance-worker:
    image: a7p5-api:acceptance
    init: true
    cgroup: host
    volumes:
      - ${A7P5_CGROUP_HOST_ROOT:?Run prepare-host.sh first}:/var/a7p5-cgroup:rw
      - ${A7P5_SCRATCH_HOST_ROOT:?Run prepare-host.sh first}:/var/a7p5-scratch:rw
    env_file: .env.acceptance
    environment:
      SKIP_MIGRATIONS: "true"
    command: celery -A config worker -l info -Q a7p5-maintenance -c 1 --prefetch-multiplier=1
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    image: a7p5-api:acceptance
    init: true
    env_file: .env.acceptance
    environment:
      SKIP_MIGRATIONS: "true"
    command: celery -A config beat -l info
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
