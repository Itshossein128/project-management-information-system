name: E2E

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ipcas
          POSTGRES_PASSWORD: ipcas
          POSTGRES_DB: ipcas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ipcas -d ipcas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: ipcas
          RABBITMQ_DEFAULT_PASS: ipcas
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Build web app
        run: pnpm --filter web build

      - name: Run Playwright smoke tests
        run: >
          pnpm --filter web exec playwright test
          e2e/tests/auth-login.spec.ts
          e2e/tests/projects.spec.ts
          e2e/tests/members-wbs.spec.ts
          e2e/tests/sprint3-schedule.spec.ts
          e2e/tests/offline-sync.spec.ts
          e2e/tests/daily-report.spec.ts
          e2e/tests/contracts-ipc.spec.ts
        env:
          CI: "true"
          CELERY_TASK_ALWAYS_EAGER: "true"
          AUDIT_LOG_ASYNC: "false"
          DATABASE_URL: postgres://ipcas:ipcas@localhost:5432/ipcas_test
          SECRET_KEY: ci-test-secret
