name: E2E

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "e2e/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "e2e/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

jobs:
  activation-feedback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --registry https://registry.npmjs.org/
      - run: pnpm exec playwright install --with-deps chromium
      - name: Test project activation messages on desktop and mobile
        run: pnpm test:project-activation
      - name: Upload activation test report and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: project-activation-report
          path: |
            playwright-report/project-activation/
            test-results/project-activation.json
            test-results/project-activation/
          if-no-files-found: ignore

  playwright:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Build web app
        run: pnpm --filter web build

      - name: Run Playwright smoke tests
        run: >
          pnpm --filter web exec playwright test
          e2e/tests/auth-login.spec.ts
          e2e/tests/projects.spec.ts
          e2e/tests/members-wbs.spec.ts
          e2e/tests/sprint3-schedule.spec.ts
          e2e/tests/offline-sync.spec.ts
          e2e/tests/daily-report.spec.ts
          e2e/tests/contracts-ipc.spec.ts
        env:
          CI: "true"
          DATABASE_URL: "sqlite:///:memory:"
          CELERY_TASK_ALWAYS_EAGER: "true"
          AUDIT_LOG_ASYNC: "false"
