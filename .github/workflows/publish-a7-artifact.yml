name: Publish immutable A7 artifact
on:
  workflow_dispatch:
  push:
    branches: [develop]
    paths:
      - .github/workflows/publish-a7-artifact.yml
      - ops/a7-artifacts/assemble-release.sh
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Verify and publish the immutable delivery archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: ops/a7-artifacts/assemble-release.sh
