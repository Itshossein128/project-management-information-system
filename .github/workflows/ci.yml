name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/**"
      - "infra/**"
      - "scripts/**"
      - "docker-compose*.yml"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/**"
      - "infra/**"
      - "scripts/**"
      - "docker-compose*.yml"
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web build

  api:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ipcas
          POSTGRES_PASSWORD: ipcas
          POSTGRES_DB: ipcas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ipcas -d ipcas_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: ipcas
          RABBITMQ_DEFAULT_PASS: ipcas
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 8
    env:
      DATABASE_URL: postgres://ipcas:ipcas@localhost:5432/ipcas_test
      SECRET_KEY: ci-test-secret
      DEBUG: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1
      RABBITMQ_URL: amqp://ipcas:ipcas@localhost:5672/
      AWS_S3_ENDPOINT_URL: http://localhost:9000
      AWS_ACCESS_KEY_ID: ipcas
      AWS_SECRET_ACCESS_KEY: ipcas-secret
      AWS_STORAGE_BUCKET_NAME: ipcas-files
      AWS_S3_USE_SSL: "false"
      AUDIT_LOG_ASYNC: "false"
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0
      CELERY_TASK_ALWAYS_EAGER: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.2"
          cache: false
      - name: Start MinIO for API integration tests
        run: |
          # Upstream community container images are no longer publicly available.
          # Build a fixed upstream release instead of relying on a third-party image.
          export GOBIN="$RUNNER_TEMP/minio-bin"
          go install github.com/minio/minio@RELEASE.2025-09-07T16-13-09Z
          MINIO_ROOT_USER=ipcas MINIO_ROOT_PASSWORD=ipcas-secret MINIO_BROWSER=off \
            "$GOBIN/minio" server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 \
            > "$RUNNER_TEMP/minio.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:9000/minio/health/live; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/minio.log"
          exit 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install compatible API test dependencies
        run: |
          python -m venv apps/api/.venv
          apps/api/.venv/bin/pip install -r apps/api/requirements.txt pytest pytest-django pytest-cov PyYAML
          echo "$GITHUB_WORKSPACE/apps/api/.venv/bin" >> "$GITHUB_PATH"
      - name: Gate and smoke runner regression tests
        run: apps/api/.venv/bin/python -m pytest scripts/tests
      - run: python manage.py check
        working-directory: apps/api/core
      - run: python manage.py migrate --noinput
        working-directory: apps/api/core
      - name: Create MinIO bucket
        run: |
          python - <<'PY'
          import boto3
          from botocore.config import Config
          import os
          client = boto3.client(
              's3',
              endpoint_url=os.environ['AWS_S3_ENDPOINT_URL'],
              aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],
              region_name='us-east-1',
              config=Config(signature_version='s3v4'),
          )
          bucket = os.environ['AWS_STORAGE_BUCKET_NAME']
          try:
              client.create_bucket(Bucket=bucket)
          except client.exceptions.BucketAlreadyOwnedByYou:
              pass
          except Exception as exc:
              if 'BucketAlreadyOwnedByYou' not in str(exc) and 'AlreadyOwnedByYou' not in str(exc):
                  raise
          PY
        working-directory: apps/api/core
      - run: python manage.py verify_blueprint_schema
        working-directory: apps/api/core
      - run: python manage.py setup_event_topology
        working-directory: apps/api/core
      - name: Seed isolated smoke roles
        run: python manage.py seed_test_roles --skip-demo
        working-directory: apps/api/core
      - name: Rehearse blocked and healthy gates, then live smoke
        run: |
          apps/api/.venv/bin/python apps/api/core/manage.py runserver 127.0.0.1:8001 --noreload > /tmp/r0-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8001/api/health/ > /dev/null; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          scripts/rehearse_r0_gate_and_smoke.sh --env-file .env.test-env.example --api-base http://127.0.0.1:8001
      - run: pytest contracts --cov=contracts --cov-report=term-missing --cov-fail-under=100
        working-directory: apps/api/core
      - run: pytest projects wbs permissions
        working-directory: apps/api/core
      - run: pytest field_reports schedule cost_control sub_reports --cov-fail-under=80
        working-directory: apps/api/core
      - run: python -m pytest events authentication audit storage
        working-directory: apps/api/core
