http:
  middlewares:
    api-read-ratelimit:
      rateLimit:
        average: 150
        burst: 300
    api-write-ratelimit:
      rateLimit:
        average: 40
        burst: 80
    login-ratelimit:
      rateLimit:
        average: 10
        period: 1m
        burst: 5

  routers:
    api-login:
      rule: PathPrefix(`/api/auth/login`)
      entryPoints:
        - web
        - websecure
      middlewares:
        - login-ratelimit
      service: api
      priority: 100

    api-write:
      rule: PathPrefix(`/api`) && (Method(`POST`) || Method(`PUT`) || Method(`PATCH`) || Method(`DELETE`))
      entryPoints:
        - web
        - websecure
      middlewares:
        - api-write-ratelimit
      service: api
      priority: 90

    api-read:
      rule: PathPrefix(`/api`)
      entryPoints:
        - web
        - websecure
      middlewares:
        - api-read-ratelimit
      service: api
      priority: 80

    admin:
      rule: PathPrefix(`/admin`)
      entryPoints:
        - web
        - websecure
      service: api
      priority: 85

    static:
      rule: PathPrefix(`/static`)
      entryPoints:
        - web
        - websecure
      service: api
      priority: 85

    web:
      rule: PathPrefix(`/`)
      entryPoints:
        - web
        - websecure
      service: web
      priority: 1
      tls:
        certResolver: letsencrypt
        domains:
          - main: "www.toop-e-ghelgheli-2.ir"
            sans:
              - "toop-e-ghelgheli-2.ir"

  services:
    api:
      loadBalancer:
        servers:
          - url: http://api:8000
    web:
      loadBalancer:
        servers:
          - url: http://web:3000
